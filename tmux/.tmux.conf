unbind-key C-s
set-option -g prefix C-s

set-option -g default-terminal "screen-256color"
set-option -sa terminal-overrides ',xterm-256color:RGB'
set-option -sg escape-time 10
set-option -g focus-events on
set-option -g history-limit 100000

set-option -g status-position top

bind-key 'r' source-file ~/.tmux.conf \; display-message "reloaded configuration."

bind-key 'h' select-pane -L
bind-key 'j' select-pane -D
bind-key 'k' select-pane -U
bind-key 'l' select-pane -R

bind-key 'H' resize-pane -L 5
bind-key 'J' resize-pane -D 5
bind-key 'K' resize-pane -U 5
bind-key 'L' resize-pane -R 5

bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

bind a setw synchronize-panes \; display "synchronize-panes #{?pane_synchronized,on,off}"

bind P run-shell "zsh -c ~/.config/tmux/popup.zsh"

# source-file ~/.config/tmux/themes/gruvbox.tmux

set -g @catppucin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

# auto start terminal
set -g @continuum-boot 'on'
set -g @continuum-boot-options 'wezterm'

# auto restore tmux
set -g @continuum-restore 'on'

# General statusline customisation
set -g status-style 'bg=terminal'

# Theme
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "rounded"

# window style
set -wg automatic-rename on
set -g automatic-rename-format ''
# set -g window-status-separator '|'
set -g status-justify 'absolute-centre'
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text_color "#{@thm_surface_0}"
set -g @catppuccin_window_number_color "#{@thm_yellow}"
set -g @catppuccin_window_current_text_color "#{@thm_surface_1}"
set -g @catppuccin_window_current_number_color "#{@thm_peach}"
set -g @catppuccin_window_number "#I"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_number "#I"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_flags "icon"

set -g @catppuccin_window_left_separator "#[fg=#{@_ctp_status_bg},reverse]#[none]"
set -g @catppuccin_window_middle_separator " "
set -g @catppuccin_window_right_separator "#[fg=#{@_ctp_status_bg},reverse]#[none]"
set -g @catppuccin_window_current_left_separator "#[fg=#{@_ctp_status_bg},reverse]#[none]"
set -g @catppuccin_window_current_middle_separator " "
set -g @catppuccin_window_current_right_separator "#[fg=#{@_ctp_status_bg},reverse]#[none]"

# status left style
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{?client_prefix,#{#[bg=#{@thm_red},fg=#{@thm_mantle},bold]  #S },#{#[bg=#{@thm_mantle},fg=#{@thm_green}]  #S }}"
set -ga status-left "#[bg=#{@thm_mantle},fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=#{@thm_mantle},fg=#{@thm_maroon}]  #{pane_current_command} "
set -ga status-left "#[bg=#{@thm_mantle},fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=#{@thm_mantle},fg=#{@thm_blue}]  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} "

# status right style
set -g status-right-length 100
set -g status-right ""
set -ga status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_date_time}"
set -agF status-right "#{E:@catppuccin_status_cpu}"

# pane style
set -g pane-border-status "bottom"
set -g @catppuccin_pane_status_enabled "yes"
set -g @catppuccin_pane_border_status "yes"
set -g @catppuccin_pane_default_text "##{pane_current_path}"

run ~/.config/tmux/plugins/catppuccin/catppuccin.tmux
run ~/.config/tmux/plugins/tmux-cpu/cpu.tmux

bind-key 'C' run-shell "zsh -c ~/.config/tmux/select_theme.zsh"
